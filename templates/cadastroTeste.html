<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #fff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
      color: #111;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 11px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 5px;
    }

    button:hover {
      background-color: #0069d9;
    }

    /* Container do switch */
    .switch-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      width: 100%;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }

    input:checked + .slider {
      background-color: #007bff;
    }

    input:checked + .slider::before {
      transform: translateX(24px);
    }

    .switch-label {
      font-size: 14.5px;
      color: #111;
      font-weight: 500;
      user-select: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Cadastro</h2>

    <form id="formCadastro" method="POST">
      <!-- Campos Colaborador -->
      <div id="camposColaborador">
        <input type="text" name="nome" placeholder="Nome do Colaborador" required>
        <input type="text" name="matricula" placeholder="Matrícula" required>
        <input type="email" placeholder="E-mail" required>
      </div>

      <!-- Campos Fornecedor -->
      <div id="camposFornecedor" class="hidden">
        <input type="text" name="nome" placeholder="Nome do Fornecedor" required>
        <input type="text" name="cnpj" placeholder="CNPJ" required>
        <input type="tel" name="telefone" placeholder="Telefone" pattern="[0-9]{10,11}" required>
        <input type="email" name="email" placeholder="E-mail" required>
      </div>

      <input type="password" name="senha" placeholder="Senha" required>
      <input type="password" name="confirmar_senha" placeholder="Confirmar senha" required>

      <button type="submit" name="submit_button" value="enviar">Cadastrar</button>

      <div class="switch-container">
        <label class="switch">
          <input type="checkbox" id="toggle" name="chave" >
          <span class="slider"></span>
        </label>
        <span class="switch-label" id="switchText">Colaborador</span>
      </div>
    </form>
  </div>

  <script>
    const toggle = document.getElementById('toggle');
    const camposColaborador = document.getElementById('camposColaborador');
    const camposFornecedor = document.getElementById('camposFornecedor');
    const switchText = document.getElementById('switchText');

    toggle.addEventListener('change', () => {
      if (toggle.checked) {
        camposColaborador.classList.remove('hidden');
        camposFornecedor.classList.add('hidden');
        switchText.textContent = 'Colaborador';
      } else {
        camposColaborador.classList.add('hidden');
        camposFornecedor.classList.remove('hidden');
        switchText.textContent = 'Fornecedor';
      }
    });
  </script>
</body>
</html>
